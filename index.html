<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Bisou</title>
    
    <meta name="description" content="Verknüpfe dich mit einem Bisou-Partner.">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#F8F7FF" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#F8F7FF" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Bisou">
    <meta name="format-detection" content="telephone=no">

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    
    <!-- Splash Screens for iOS -->
    <link rel="apple-touch-startup-image" href="/favicon.png">
    
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://bisou.benelabs.de/">
    <meta property="og:title" content="Bisou">
    <meta property="og:description" content="Verknüpfe dich mit einem Bisou-Partner.">
    
    <meta property="og:image" content="https://bisou.benelabs.de/vorschau.jpg?v=2">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
    <script>
      (function() {
        try {
          var isDark = localStorage.getItem('app_dark_mode') === 'true';
          var isPublicPath = window.location.pathname === '/' || 
                             window.location.pathname === '/signin' || 
                             window.location.pathname === '/signup' || 
                             window.location.pathname === '/reset-password';
          
          if (isDark && !isPublicPath) {
            document.documentElement.classList.add('dark');
            document.querySelectorAll('meta[name="theme-color"]').forEach(function(meta) {
              meta.setAttribute('content', '#0C0A15');
            });
          }
        } catch (e) {}
      })();

      // Capture PWA install prompt early
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-install-prompt'));
      });

      // Register Service Worker manually as fallback
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function(err) {
            console.log('SW registration failed:', err);
          });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
